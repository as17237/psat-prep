name: Test and Validate Dataset

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Parser Unit Tests
        run: |
          python -m unittest test_extractor.py -v

      - name: Run Node SRS and Free-Response Tests
        run: |
          node tests/test_free_response.js
          node tests/test_srs.js
          node tests/test_dataset_free_response.js

      # WI-07 data-integrity suite — OFFLINE parts only.
      # These need no Azure credentials: test_merge_pins.js runs the extracted
      # api/src/lib/merge.js against hand-written fixtures (the contract that keeps
      # concurrent v1/v2 clients from destroying each other's data), and
      # test_snapshot_diff.js runs tests/integrity/snapshot_diff.js against the
      # hand-written backup fixtures in tests/integrity/fixtures/.
      # The LIVE parts (tests/integrity/run_integrity.js) are deliberately NOT here —
      # they read production Cosmos and run from scripts/preflight_backup.sh instead.
      # WI-11.5 adds two more offline suites here for the same reason: test_datamodel.js
      # proves the slim codec round-trips the REAL production document byte-for-byte
      # (fixture committed at tests/integrity/fixtures/), and test_shard_routing.js
      # proves a captured real v1 payload produces the same state through the new
      # sharded server logic as it does through today's.
      - name: Run Offline Integrity Tests (merge pins + snapshot diff + data model + shard routing)
        run: |
          node tests/integrity/test_merge_pins.js
          node tests/integrity/test_snapshot_diff.js
          node tests/integrity/test_datamodel.js
          node tests/integrity/test_shard_routing.js

      # WI-11.5's no-wall gate: every document under 400 KB at full 3,059-question
      # coverage. Exits non-zero if any document crosses the budget or if the SRS
      # history cap stops engaging.
      - name: Full-bank storage simulation (document size gate)
        run: node scripts/simulate_full_bank.js

      - name: Shard-migration guard self-check (offline, writes nothing)
        run: node scripts/migrate_to_shards.js --assert-test

      - name: Validate Extracted Dataset
        run: |
          python -c "import os, json; from validator import validate_dataset; \
            ela = json.load(open('data/ela_questions.json')); \
            math = json.load(open('data/math_questions.json')); \
            img_dir = 'data/images' if os.path.exists('data/images') else None; \
            res = validate_dataset(ela + math, base_image_dir=img_dir); \
            assert res['is_valid'], 'Dataset validation failed!'; \
            print('CI Validation Succeeded:', res['valid_count'], 'valid questions,', res['text_complete_count'], 'text-complete')"
