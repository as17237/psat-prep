name: E2E (Playwright)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (for the static server the app runs from)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright test harness (dev-only; the app itself stays dependency-free)
        run: npm ci

      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium

      # Local-server projects only -- these run against `python3 -m
      # http.server` per playwright.config.js's webServer, with the
      # sync-interceptor quarantine in tests/e2e/fixtures.js stubbing every
      # /api/sync call. The @v2smoke project (live network against the
      # deployed /v2/ site) is intentionally NOT run here -- it has no place
      # in a PR gate that should not depend on live infrastructure being up,
      # and it is excluded from `npm run test:e2e` for the same reason. Run
      # it locally with `npm run test:e2e:v2smoke`.
      - name: Run Playwright E2E baseline (chromium desktop + mobile)
        run: npm run test:e2e

      # Artifacts are kept light per the WI-08 brief (list reporter only,
      # trace off, video off) -- only failure screenshots exist, so only
      # upload test-results/ (and only when something actually failed).
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
